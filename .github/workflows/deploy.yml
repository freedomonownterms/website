name: Build and deploy site

on:
  # Deploy whenever changes are pushed.
  push:
    branches: [main]
  # Rebuild every day at 06:00 UTC (11:30 IST) to refresh the news.
  schedule:
    - cron: '0 6 * * *'
  # Allow a manual rebuild from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing and other IndexNow search engines about the pages. Only when content was pushed,
  # not on the daily news rebuild. A failure here doesn't affect the live site.
  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node scripts/indexnow.mjs
